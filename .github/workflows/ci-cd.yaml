name: CI/CD Pipeline - DevSecOps

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

env:
  AWS_REGION: us-west-1
  ECR_REGISTRY: 798329741052.dkr.ecr.us-west-1.amazonaws.com
  ECR_REPOSITORY: devsecops-lab-app
  EKS_CLUSTER: devsecops-lab-cluster

jobs:
  # ─── Job 1 : Build & Scan ───────────────────────────────────────
  build-and-scan:
    name: Build & Security Scan
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Configure AWS credentials
      uses: aws-actions/configure-aws-credentials@v4
      with:
        aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
        aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        aws-region: ${{ env.AWS_REGION }}

    - name: Login to Amazon ECR
      id: login-ecr
      uses: aws-actions/amazon-ecr-login@v2

    - name: Build Docker image
      run: |
        docker build -t $ECR_REGISTRY/$ECR_REPOSITORY:${{ github.sha }} ./app
        docker tag $ECR_REGISTRY/$ECR_REPOSITORY:${{ github.sha }} \
                   $ECR_REGISTRY/$ECR_REPOSITORY:latest

    - name: Trivy scan - vulnerabilities
      uses: aquasecurity/trivy-action@master
      with:
        image-ref: ${{ env.ECR_REGISTRY }}/${{ env.ECR_REPOSITORY }}:${{ github.sha }}
        format: table
        exit-code: '1'
        severity: CRITICAL
        ignore-unfixed: true

    - name: Trivy scan - K8s manifests
      uses: aquasecurity/trivy-action@master
      with:
        scan-type: config
        scan-ref: ./k8s
        format: table
        exit-code: '0'
        severity: HIGH,CRITICAL

    - name: Push image to ECR
      if: github.ref == 'refs/heads/main'
      run: |
        docker push $ECR_REGISTRY/$ECR_REPOSITORY:${{ github.sha }}
        docker push $ECR_REGISTRY/$ECR_REPOSITORY:latest

    - name: Update image tag in deployment
      if: github.ref == 'refs/heads/main'
      run: |
        sed -i "s|:latest|:${{ github.sha }}|g" k8s/app/deployment.yaml
        git config user.name "github-actions"
        git config user.email "actions@github.com"
        git add k8s/app/deployment.yaml
        git commit -m "ci: update image tag to ${{ github.sha }}" || echo "No changes"
        git push

  # ─── Job 2 : Deploy via ArgoCD ──────────────────────────────────
  deploy:
    name: Deploy to EKS
    runs-on: ubuntu-latest
    needs: build-and-scan
    if: github.ref == 'refs/heads/main'

    steps:
    - name: Configure AWS credentials
      uses: aws-actions/configure-aws-credentials@v4
      with:
        aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
        aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        aws-region: ${{ env.AWS_REGION }}

    - name: Update kubeconfig
      run: |
        aws eks update-kubeconfig --region $AWS_REGION --name $EKS_CLUSTER

    - name: Deploy namespace
      run: kubectl apply -f k8s/app/namespace.yaml

    - name: Deploy application
      run: |
        kubectl apply -f k8s/app/deployment.yaml
        kubectl apply -f k8s/app/service.yaml
        kubectl rollout status deployment/devsecops-app -n app --timeout=120s
